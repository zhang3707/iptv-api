name: 'Update schedule'

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      # 🚀 🟢 【硬核破局】：直接无脑拉取 main 分支，彻底干掉一切变量拼接和 main* 垃圾通配符污染！
      - uses: actions/checkout@v4
        with:
          ref: main

      # 🚀 🟢 【2026 环境对齐】：升级到 setup-python@v5，全量适配 GitHub Actions 最新的 Node 24 运行时，彻底闭嘴 Deprecation 警告！
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy

      - name: Update
        # 🎯 强制让洗货跑车吞入你的 user_config.ini。
        # 如果项目老旧代码不支持传参报错，只需将其改回 `pipenv run dev` 即可。优先推荐强制吃配置写法：
        run: pipenv run dev config/user_config.ini

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
