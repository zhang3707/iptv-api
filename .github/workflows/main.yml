name: 'Update schedule'

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      # 🚀 🟢 【降维打击】：去掉任何 ref 传参！让 checkout 默认盲拉当前触发它的最干净主分支，彻底根除 main* 幽灵污染
      - uses: actions/checkout@v4

      # 🚀 🟢 全量适配 Node 24 运行时环境
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy

      - name: Update
        # 🎯 优先尝试让原项目跑车吃你的 user_config.ini
        # 如果项目老旧代码不支持传参报错，只需将其改回 `pipenv run dev` 即可。
        run: pipenv run dev config/user_config.ini

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
